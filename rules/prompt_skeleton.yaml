#   - docs/adr/0024-persona-intro-yaml-field-and-prompt-skeleton.md
#   - docs/adr/0023-builder-injects-sample-lines-and-npc-tone.md
#   - docs/mechanic-spec.md (Layer 3 메타-디펜스 mandate)
