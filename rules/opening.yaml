# 오프닝(세션 첫 NPC 발화) 콜 — B2 session bootstrap.
# instruction 은 플레이어 입력이 없는 오프닝 턴에서 LLM 에 주는 pseudo-user 지시문,
# error_message 는 오프닝 생성 실패(503) 시 시스템 톤 안내. 튜닝은 코드가 아닌 여기서.
instruction: |-
  (시스템 지시: 플레이어가 방금 처음으로 네 앞에 나타났다. 플레이어는 아직 아무 말도
  하지 않았다. 네가 먼저 말을 걸어 대화를 연다 — 지금 하던 일과 섬의 일상 속에서
  자연스럽게, 짧게. 플레이어가 하지 않은 말을 지어내지 마라.)
error_message: |-
  서버가 일시적으로 응답하지 않습니다. 잠시 후 다시 시도해 주세요.
