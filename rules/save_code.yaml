# 세이브 코드(B3) 시스템 문구 — redeem 실패 시 사용자 노출 메시지.
# 튜닝은 코드가 아닌 여기서. (발급 거부 401 문구는 /turn 401 과 같은 결이므로
# rules/identity.yaml no_session_message 를 재사용 — 같은 사실 한 곳.
# redeem 중 오프닝 생성 실패 503 문구는 같은 "서버 일시 장애" 상황이므로
# rules/opening.yaml error_message 를 재사용.)
redeem_not_found_message: |-
  세이브 코드를 찾을 수 없습니다. 코드를 다시 확인해 주세요.

# redeem 시도 제한 (직결 IP 당). 코드 공간은 15 × 31^4 ≈ 1,385만 —
# 시간당 10회면 온라인 추측은 가망이 없고, 코드를 잘못 친 사람은 걸리지 않는다.
# 형식 위반·404·성공을 가리지 않고 모든 시도가 집계된다 (성공은 예산을 되돌리지 않는다).
redeem_rate_limit_attempts: 10
redeem_rate_limit_window_seconds: 3600
# 초과 시 429 문구 — 왜 막혔는지는 숨기지 않되, 코드가 맞았는지 틀렸는지는 알려주지
# 않는다 (공격자에게 유효 코드 정보를 주지 않는다). 솔직한 시스템 톤.
redeem_rate_limited_message: >-
  세이브 코드 확인 시도가 너무 많습니다. 코드 추측을 막기 위한 제한입니다.
  시간을 두고 다시 시도해 주세요.
