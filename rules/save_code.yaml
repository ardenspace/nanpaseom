# 세이브 코드(B3) 시스템 문구 — redeem 실패 시 사용자 노출 메시지.
# 튜닝은 코드가 아닌 여기서. (발급 거부 401 문구는 /turn 401 과 같은 결이므로
# rules/identity.yaml no_session_message 를 재사용 — 같은 사실 한 곳.
# redeem 중 오프닝 생성 실패 503 문구는 같은 "서버 일시 장애" 상황이므로
# rules/opening.yaml error_message 를 재사용.)
redeem_not_found_message: |-
  세이브 코드를 찾을 수 없습니다. 코드를 다시 확인해 주세요.
